<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скрябин: картина → музыка</title>
<style>
  body { margin:0; background:#111; color:#eee; font-family:sans-serif; text-align:center; }
  video { width:100%; max-width:400px; border-radius:12px; margin-top:12px; border: 2px solid #333; }
  #note { font-size:1.5em; margin:12px; height: 30px; font-weight: bold; color: #4a9; }
  #color { width:60px; height:60px; border-radius:50%; display:inline-block; border:2px solid #fff; vertical-align: middle; margin-right: 10px;}
  button { padding:12px 24px; font-size:1em; border-radius:8px; border:none; background:#4a9; color:#000; margin:8px; font-weight: bold;}
  #unlock { background: #d35400; color: white; display: none; margin-top: 10px; width: 80%; max-width: 300px; }
  #history { font-size: 0.9em; color: #888; margin-top: 10px; }
</style>
</head>
<body>
<h2>Наведи камеру на картину</h2>
<video id="cam" autoplay playsinline></video>
<button id="unlock">1. Нажми для звука</button>
<div style="margin-top: 15px;">
  <div id="color"></div>
  <div id="note">—</div>
</div>
<button id="start">Включить камеру</button>
<button id="stop">Стоп</button>
<div id="history"></div>

<script>
// Таблица Скрябина
const SKRYABIN = [
  { note: 'C',  name: 'до',        rgb: [255, 0, 0] },
  { note: 'G',  name: 'соль',      rgb: [255, 128, 80] },
  { note: 'D',  name: 'ре',        rgb: [255, 255, 0] },
  { note: 'A',  name: 'ля',        rgb: [0, 255, 0] },
  { note: 'E',  name: 'ми',        rgb: [180, 220, 255] },
  { note: 'B',  name: 'си',        rgb: [180, 220, 255] },
  { note: 'F#', name: 'фа-диез',   rgb: [0, 0, 255] },
  { note: 'Db', name: 'ре-бемоль', rgb: [128, 0, 128] },
  { note: 'Ab', name: 'ля-бемоль', rgb: [160, 0, 200] },
  { note: 'Eb', name: 'ми-бемоль', rgb: [150, 150, 160] },
  { note: 'Bb', name: 'си-бемоль', rgb: [150, 150, 160] },
  { note: 'F',  name: 'фа',        rgb: [139, 0, 0] }
];

const FREQ = {
  'C': 261.63, 'D': 293.66, 'E': 329.63, 'F': 349.23,
  'G': 392.00, 'A': 440.00, 'B': 493.88,
  'Db': 277.18, 'Eb': 311.13, 'F#': 369.99, 'Ab': 415.30, 'Bb': 466.16
};

const video = document.getElementById('cam');
const noteEl = document.getElementById('note');
const colorEl = document.getElementById('color');
const historyEl = document.getElementById('history');
const unlockBtn = document.getElementById('unlock');

let stream = null, interval = null, audioCtx = null;
let history = [];

// Инициализация звука по нажатию кнопки
unlockBtn.onclick = () => {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  audioCtx.resume().then(() => {
    unlockBtn.style.display = 'none';
    // Короткий тестовый писк, чтобы понять, что звук включился
    playChord([{note: 'C'}], 0.1); 
  });
};

function getDominantColor(videoEl) {
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(videoEl, 0, 0, 64, 64);
  const data = ctx.getImageData(0, 0, 64, 64).data;
  
  let bestR = 0, bestG = 0, bestB = 0;
  let maxSaturation = -1;

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const saturation = max === 0 ? 0 : (max - min) / max;
    
    if (saturation > maxSaturation && max > 50) {
      maxSaturation = saturation;
      bestR = r; bestG = g; bestB = b;
    }
  }
  return [bestR, bestG, bestB];
}

function nearestNote(r, g, b) {
  let best = null, bestDist = Infinity;
  for (const s of SKRYABIN) {
    const dr = r - s.rgb[0], dg = g - s.rgb[1], db = b - s.rgb[2];
    const d = dr*dr + dg*dg + db*db;
    if (d < bestDist) { bestDist = d; best = s; }
  }
  return best;
}

// Играем сразу две ноты (аккорд) для красоты
function playChord(notesArray, duration = 1.5) {
  if (!audioCtx) return;
  
  notesArray.forEach((note, index) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'triangle'; 
    // Вторую ноту берем на октаву выше для объема
    let freq = FREQ[note.note] || 440;
    if (index > 0) freq *= 2; 
    
    osc.frequency.value = freq;
    
    // Плавное нарастание и затухание
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.15, now + 0.2);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  });
}

function analyze() {
  if (!video.videoWidth) return;
  
  const [r, g, b] = getDominantColor(video);
  colorEl.style.background = `rgb(${r},${g},${b})`;
  
  const mainNote = nearestNote(r, g, b);
  noteEl.textContent = `${mainNote.name} (${mainNote.note})`;
  
  if (history[history.length - 1] !== mainNote.note) {
      history.push(mainNote.note);
      if (history.length > 4) history.shift();
      historyEl.textContent = "Звучит: " + history.join(' • ');
      
      // Играем аккорд: основная нота + предыдущая нота из истории (если есть)
      let chord = [mainNote];
      if (history.length > 1) {
         const prevNote = SKRYABIN.find(n => n.note === history[history.length - 2]);
         if (prevNote) chord.push(prevNote);
      }
      playChord(chord);
  }
}

document.getElementById('start').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    history = [];
    unlockBtn.style.display = 'block'; // Показываем кнопку разблокировки звука
    
    // Запускаем анализ только если звук уже разблокирован
    if (interval) clearInterval(interval);
    interval = setInterval(analyze, 1500);
  } catch (e) {
    alert('Камера недоступна: ' + e.message);
  }
};

document.getElementById('stop').onclick = () => {
  if (interval) clearInterval(interval);
  if (stream) stream.getTracks().forEach(t => t.stop());
  noteEl.textContent = '—';
  historyEl.textContent = '';
  unlockBtn.style.display = 'none';
};
</script>
</body>
</html>
