<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скрябин: Анализ картины</title>
<style>
  body { margin:0; background:#111; color:#eee; font-family:sans-serif; text-align:center; }
  .video-container { position: relative; display: inline-block; max-width:100%; width: 90vw; max-width: 500px; overflow: hidden; border-radius:12px; margin-top:12px; border: 2px solid #333; }
  video { width:100%; display: block; object-fit: cover; }
  
  #scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .scan-dot { position: absolute; width: 3px; height: 3px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 2px rgba(255,255,255,0.8); }
  
  #note { font-size:1.2em; margin:12px; height: 30px; font-weight: bold; color: #4a9; }
  #color { width:30px; height:30px; border-radius:50%; display:inline-block; border:2px solid #fff; vertical-align: middle; margin-right: 10px;}
  button { padding:12px 20px; font-size:0.95em; border-radius:8px; border:none; background:#4a9; color:#000; margin:5px; font-weight: bold; cursor:pointer;}
  button:disabled { background: #555; color: #888; cursor: not-allowed; }
  #unlock { background: #d35400; color: white; display: none; margin-top: 10px; width: 80%; max-width: 300px; }
  #history { font-size: 0.85em; color: #888; margin-top: 10px; word-wrap: break-word; padding: 0 15px; height: 50px; overflow-y: auto;}
  #status { font-size: 1.1em; color: #e67e22; font-weight: bold; height: 25px; margin-top: 10px;}
</style>
</head>
<body>
<h2>Сканер мелодии</h2>
<div class="video-container">
    <video id="cam" autoplay playsinline></video>
    <div id="scanner-line"></div>
</div>

<button id="unlock">1. Нажми для звука</button>
<div style="margin-top: 5px;">
  <div id="color"></div>
  <div id="note">—</div>
</div>
<div id="status"></div>
<button id="start">Включить камеру</button>
<button id="scan" disabled>Сканировать и Играть</button>
<button id="stop">Стоп</button>
<div id="history"></div>

<script>
const SKRYABIN = [
  { note: 'C',  name: 'до',        rgb: [255, 0, 0] },
  { note: 'G',  name: 'соль',      rgb: [255, 128, 80] },
  { note: 'D',  name: 'ре',        rgb: [255, 255, 0] },
  { note: 'A',  name: 'ля',        rgb: [0, 255, 0] },
  { note: 'E',  name: 'ми',        rgb: [180, 220, 255] },
  { note: 'B',  name: 'си',        rgb: [180, 220, 255] },
  { note: 'F#', name: 'фа-диез',   rgb: [0, 0, 255] },
  { note: 'Db', name: 'ре-бемоль', rgb: [128, 0, 128] },
  { note: 'Ab', name: 'ля-бемоль', rgb: [160, 0, 200] },
  { note: 'Eb', name: 'ми-бемоль', rgb: [150, 150, 160] },
  { note: 'Bb', name: 'си-бемоль', rgb: [150, 150, 160] },
  { note: 'F',  name: 'фа',        rgb: [139, 0, 0] }
];

const BASE_FREQ = {
  'C': 261.63, 'D': 293.66, 'E': 329.63, 'F': 349.23,
  'G': 392.00, 'A': 440.00, 'B': 493.88,
  'Db': 277.18, 'Eb': 311.13, 'F#': 369.99, 'Ab': 415.30, 'Bb': 466.16
};

const CHROMATIC = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];

const video = document.getElementById('cam');
const scannerLine = document.getElementById('scanner-line');
const noteEl = document.getElementById('note');
const colorEl = document.getElementById('color');
const historyEl = document.getElementById('history');
const statusEl = document.getElementById('status');
const unlockBtn = document.getElementById('unlock');
const scanBtn = document.getElementById('scan');

let stream = null, audioCtx = null;
let collectedNotes = [];
let isScanning = false;

unlockBtn.onclick = () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume().then(() => {
    unlockBtn.style.display = 'none';
    scanBtn.disabled = false;
    playInstrument(440, 0.5, 0.1, 'sine'); 
  });
};

function nearestNote(r, g, b) {
  let best = null, bestDist = Infinity;
  for (const s of SKRYABIN) {
    const dr = r - s.rgb[0], dg = g - s.rgb[1], db = b - s.rgb[2];
    const d = dr*dr + dg*dg + db*db;
    if (d < bestDist) { bestDist = d; best = s; }
  }
  return best;
}

function playInstrument(freq, duration = 0.5, vol = 0.2, type = 'sine') {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; 
  osc.frequency.value = freq;
  
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0.001, now);
  gain.gain.linearRampToValueAtTime(vol, now + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + duration);
}

function startScan() {
  if (isScanning || !video.videoWidth) return;
  isScanning = true;
  collectedNotes = [];
  scanBtn.disabled = true;
  statusEl.textContent = "Считывание...";
  historyEl.textContent = "";
  scannerLine.innerHTML = "";

  const gridX = 14; 
  const gridY = 14;
  const totalSteps = gridX * gridY; 
  let currentStep = 0;

  const scanInterval = setInterval(() => {
    if (currentStep >= totalSteps) {
      clearInterval(scanInterval);
      isScanning = false;
      analyzeAndPlayStyle();
      return;
    }

    const col = currentStep % gridX;
    const row = Math.floor(currentStep / gridX);
    const xPercent = (col / (gridX - 1)) * 100;
    const yPercent = (row / (gridY - 1)) * 100;

    const dot = document.createElement('div');
    dot.className = 'scan-dot';
    dot.style.left = xPercent + '%';
    dot.style.top = yPercent + '%';
    scannerLine.appendChild(dot);

    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.translate(64, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, 64, 64);
    const data = ctx.getImageData(0, 0, 64, 64).data;

    const px = Math.max(0, Math.min(63, Math.floor((xPercent / 100) * 63)));
    const py = Math.max(0, Math.min(63, Math.floor((yPercent / 100) * 63)));
    const i = (py * 64 + px) * 4;
    const r = data[i], g = data[i+1], b = data[i+2];

    dot.style.backgroundColor = `rgb(${r},${g},${b})`;
    colorEl.style.background = `rgb(${r},${g},${b})`;

    const baseNote = nearestNote(r, g, b);
    const brightness = (r + g + b) / 3; 
    
    // Запоминаем не только ноту, но и RGB, чтобы понять стиль
    collectedNotes.push({ base: baseNote.note, r: r, g: g, b: b, brightness: brightness });

    currentStep++;
  }, 15); 
}

function analyzeAndPlayStyle() {
  statusEl.textContent = "Анализ стиля...";
  noteEl.textContent = "Думаю...";
  
  setTimeout(() => {
    if (collectedNotes.length === 0) return;

    // 1. Считаем средний цвет
    let avgR = 0, avgG = 0, avgB = 0;
    let counts = {};
    collectedNotes.forEach(n => {
      avgR += n.r; avgG += n.g; avgB += n.b;
      counts[n.base] = (counts[n.base] || 0) + 1;
    });
    avgR /= collectedNotes.length;
    avgG /= collectedNotes.length;
    avgB /= collectedNotes.length;

    // 2. Определяем стиль на основе доминирующего цвета
    let styleName = "";
    let scale = [0, 2, 4, 5, 7, 9, 11]; // Мажор по умолчанию
    let baseTempo = 100;
    let instrumentType = 'sine';

    if (avgB > avgR && avgB > avgG) {
      // Много синего/фиолетового -> Импрессионизм (Дебюсси)
      styleName = "Импрессионизм (Дебюсси)";
      scale = [0, 2, 3, 5, 7, 8, 10]; // Минор
      baseTempo = 80;
      instrumentType = 'sine'; // Мягкий звук
    } else if (avgR > avgG && avgR > avgB) {
      // Много красного/оранжевого -> Классицизм (Моцарт)
      styleName = "Классицизм (Моцарт)";
      scale = [0, 2, 4, 5, 7, 9, 11]; // Мажор
      baseTempo = 120;
      instrumentType = 'triangle'; // Яркий звук
    } else if (avgG > avgR && avgG > avgB) {
      // Много зеленого -> Барокко (Бах)
      styleName = "Барокко (Бах)";
      scale = [0, 2, 3, 5, 7, 8, 11]; // Гармонический минор
      baseTempo = 110;
      instrumentType = 'sawtooth'; // Немного резковатый
    } else {
      // Темные/серые -> Модерн (Сати)
      styleName = "Модерн (Сати)";
      scale = [0, 2, 3, 5, 7, 8, 10];
      baseTempo = 70;
      instrumentType = 'sine';
    }

    statusEl.textContent = `Стиль: ${styleName}`;

    // 3. Находим тонику (самую частую ноту)
    let tonic = collectedNotes[0].base;
    let maxCount = 0;
    for (const [note, count] of Object.entries(counts)) {
      if (count > maxCount) { maxCount = count; tonic = note; }
    }
    let tonicIdx = CHROMATIC.indexOf(tonic);

    // 4. Генерируем музыку в выбранном стиле
    let step = 0;
    const stepTime = 60000 / baseTempo / 2; 
    let melodySequence = collectedNotes.filter(n => n.brightness > 100);
    if (melodySequence.length === 0) melodySequence = collectedNotes;

    function playNextStep() {
      if (step >= 32) {
        statusEl.textContent = "Готово!";
        scanBtn.disabled = false;
        noteEl.textContent = "—";
        return;
      }

      // Бас (играет каждые 4 шага)
      if (step % 4 === 0) {
        let bassFreq = (BASE_FREQ[CHROMATIC[tonicIdx % 12]] || 440) / 4;
        playInstrument(bassFreq, 1.0, 0.15, 'sine');
      }

      // Аккорд (играет каждые 8 шагов)
      if (step % 8 === 0) {
        let rootFreq = BASE_FREQ[CHROMATIC[tonicIdx % 12]] || 440;
        let thirdFreq = rootFreq * Math.pow(2, scale[2] / 12);
        let fifthFreq = rootFreq * Math.pow(2, scale[4] / 12);
        
        playInstrument(rootFreq, 2.0, 0.08, 'sine');
        playInstrument(thirdFreq, 2.0, 0.06, 'sine');
        playInstrument(fifthFreq, 2.0, 0.05, 'sine');
      }

      // Мелодия (Соло)
      if (step % 2 === 0) {
        if (Math.random() > 0.2) {
          let randomNote = melodySequence[Math.floor(Math.random() * melodySequence.length)];
          let noteIdx = CHROMATIC.indexOf(randomNote.base);
          if (noteIdx < tonicIdx) noteIdx += 12; 
          
          let octave = Math.floor(noteIdx / 12);
          let noteInOctave = noteIdx % 12;
          
          let closestScaleNote = scale[0];
          let minDiff = 100;
          scale.forEach(s => {
             if (Math.abs(noteInOctave - s) < minDiff) {
                 minDiff = Math.abs(noteInOctave - s);
                 closestScaleNote = s;
             }
          });
          
          let finalNoteIdx = octave * 12 + closestScaleNote;
          let freq = BASE_FREQ[CHROMATIC[finalNoteIdx % 12]] || 440;
          if (finalNoteIdx >= 12) freq *= 2; 

          playInstrument(freq, 0.4, 0.12, instrumentType);
          noteEl.textContent = CHROMATIC[finalNoteIdx % 12];
          historyEl.textContent = `Стиль: ${styleName}`;
        }
      }

      step++;
      setTimeout(playNextStep, stepTime);
    }

    playNextStep();
  }, 1000);
}

document.getElementById('start').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    unlockBtn.style.display = 'block';
    statusEl.textContent = "Включи звук и нажми 'Сканировать'";
  } catch (e) {
    alert('Камера недоступна: ' + e.message);
  }
};

scanBtn.onclick = startScan;

document.getElementById('stop').onclick = () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  noteEl.textContent = '—';
  statusEl.textContent = '';
  scannerLine.innerHTML = "";
  scanBtn.disabled = true;
  unlockBtn.style.display = 'none';
};
</script>
</body>
</html>
