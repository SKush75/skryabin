<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скрябин: Генератор мелодии</title>
<style>
  body { margin:0; background:#111; color:#eee; font-family:sans-serif; text-align:center; }
  .video-container { position: relative; display: inline-block; max-width:100%; width: 90vw; max-width: 500px; overflow: hidden; border-radius:12px; margin-top:12px; border: 2px solid #333; }
  video { width:100%; display: block; object-fit: cover; }
  
  #scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .scan-dot { position: absolute; width: 4px; height: 4px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 3px rgba(255,255,255,0.8); }
  
  #note { font-size:1.5em; margin:12px; height: 30px; font-weight: bold; color: #4a9; }
  #color { width:30px; height:30px; border-radius:50%; display:inline-block; border:2px solid #fff; vertical-align: middle; margin-right: 10px;}
  button { padding:12px 20px; font-size:0.95em; border-radius:8px; border:none; background:#4a9; color:#000; margin:5px; font-weight: bold; cursor:pointer;}
  button:disabled { background: #555; color: #888; cursor: not-allowed; }
  #unlock { background: #d35400; color: white; display: none; margin-top: 10px; width: 80%; max-width: 300px; }
  #history { font-size: 0.85em; color: #888; margin-top: 10px; word-wrap: break-word; padding: 0 15px; height: 50px; overflow-y: auto;}
  #status { font-size: 1.1em; color: #e67e22; font-weight: bold; height: 25px; margin-top: 10px;}
</style>
</head>
<body>
<h2>Сканер мелодии</h2>
<div class="video-container">
    <video id="cam" autoplay playsinline></video>
    <div id="scanner-line"></div>
</div>

<button id="unlock">1. Нажми для звука</button>
<div style="margin-top: 5px;">
  <div id="color"></div>
  <div id="note">—</div>
</div>
<div id="status"></div>
<button id="start">Включить камеру</button>
<button id="scan" disabled>Сканировать и Играть</button>
<button id="stop">Стоп</button>
<div id="history"></div>

<script>
const SKRYABIN = [
  { note: 'C',  name: 'до',        rgb: [255, 0, 0] },
  { note: 'G',  name: 'соль',      rgb: [255, 128, 80] },
  { note: 'D',  name: 'ре',        rgb: [255, 255, 0] },
  { note: 'A',  name: 'ля',        rgb: [0, 255, 0] },
  { note: 'E',  name: 'ми',        rgb: [180, 220, 255] },
  { note: 'B',  name: 'си',        rgb: [180, 220, 255] },
  { note: 'F#', name: 'фа-диез',   rgb: [0, 0, 255] },
  { note: 'Db', name: 'ре-бемоль', rgb: [128, 0, 128] },
  { note: 'Ab', name: 'ля-бемоль', rgb: [160, 0, 200] },
  { note: 'Eb', name: 'ми-бемоль', rgb: [150, 150, 160] },
  { note: 'Bb', name: 'си-бемоль', rgb: [150, 150, 160] },
  { note: 'F',  name: 'фа',        rgb: [139, 0, 0] }
];

const BASE_FREQ = {
  'C': 261.63, 'D': 293.66, 'E': 329.63, 'F': 349.23,
  'G': 392.00, 'A': 440.00, 'B': 493.88,
  'Db': 277.18, 'Eb': 311.13, 'F#': 369.99, 'Ab': 415.30, 'Bb': 466.16
};

const SCALES = {
  minor: [0, 2, 3, 5, 7, 8, 10],
  major: [0, 2, 4, 5, 7, 9, 11]
};

const video = document.getElementById('cam');
const scannerLine = document.getElementById('scanner-line');
const noteEl = document.getElementById('note');
const colorEl = document.getElementById('color');
const historyEl = document.getElementById('history');
const statusEl = document.getElementById('status');
const unlockBtn = document.getElementById('unlock');
const scanBtn = document.getElementById('scan');

let stream = null, audioCtx = null;
let collectedNotes = [];
let isScanning = false;

const STEP_TYPES = ['NOTE', 'SHARP', 'OCTAVE', 'SHARP_OCTAVE'];
let stepIndex = 0;

unlockBtn.onclick = () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume().then(() => {
    unlockBtn.style.display = 'none';
    scanBtn.disabled = false;
    playTone(440, 1, 0.1, 'triangle'); 
  });
};

function nearestNote(r, g, b) {
  let best = null, bestDist = Infinity;
  for (const s of SKRYABIN) {
    const dr = r - s.rgb[0], dg = g - s.rgb[1], db = b - s.rgb[2];
    const d = dr*dr + dg*dg + db*db;
    if (d < bestDist) { bestDist = d; best = s; }
  }
  return best;
}

function playTone(freq, duration = 0.5, vol = 0.2, type = 'triangle') {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; 
  osc.frequency.value = freq;
  
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0.001, now);
  gain.gain.exponentialRampToValueAtTime(vol, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + duration);
}

function startScan() {
  if (isScanning || !video.videoWidth) return;
  isScanning = true;
  collectedNotes = [];
  stepIndex = 0;
  scanBtn.disabled = true;
  statusEl.textContent = "Считывание...";
  historyEl.textContent = "";
  scannerLine.innerHTML = "";

  // Сетка 10 на 10 = 100 точек
  const gridX = 10; 
  const gridY = 10;
  const totalSteps = gridX * gridY; 
  let currentStep = 0;

  const scanInterval = setInterval(() => {
    if (currentStep >= totalSteps) {
      clearInterval(scanInterval);
      isScanning = false;
      generateMelody();
      return;
    }

    // Вычисляем позицию по сетке
    const col = currentStep % gridX;
    const row = Math.floor(currentStep / gridX);
    
    // Идут слева направо, строка за строкой
    const xPercent = (col / (gridX - 1)) * 100;
    const yPercent = (row / (gridY - 1)) * 100;

    const dot = document.createElement('div');
    dot.className = 'scan-dot';
    dot.style.left = xPercent + '%';
    dot.style.top = yPercent + '%';
    scannerLine.appendChild(dot);

    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.translate(64, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, 64, 64);
    const data = ctx.getImageData(0, 0, 64, 64).data;

    const px = Math.max(0, Math.min(63, Math.floor((xPercent / 100) * 63)));
    const py = Math.max(0, Math.min(63, Math.floor((yPercent / 100) * 63)));
    const i = (py * 64 + px) * 4;
    const r = data[i], g = data[i+1], b = data[i+2];

    dot.style.backgroundColor = `rgb(${r},${g},${b})`;
    colorEl.style.background = `rgb(${r},${g},${b})`;

    const baseNote = nearestNote(r, g, b);
    let stepType = STEP_TYPES[stepIndex % STEP_TYPES.length];
    let finalFreq = BASE_FREQ[baseNote.note] || 440;
    
    const brightness = (r + g + b) / 3;
    if (brightness < 100) finalFreq *= 0.8; 

    if (stepType === 'SHARP' || stepType === 'SHARP_OCTAVE') finalFreq *= 1.05946;
    if (stepType === 'OCTAVE' || stepType === 'SHARP_OCTAVE') finalFreq *= 2;

    playTone(finalFreq, 0.1, 0.05, 'sine');
    collectedNotes.push({ base: baseNote.note, freq: finalFreq, brightness: brightness });

    currentStep++;
    stepIndex++;
  }, 30); // Очень быстро (30 мс на точку, весь скан за 3 секунды)
}

function generateMelody() {
  statusEl.textContent = "Играем...";
  noteEl.textContent = "Думаю...";
  
  setTimeout(() => {
    if (collectedNotes.length === 0) return;

    const counts = {};
    let totalBrightness = 0;
    collectedNotes.forEach(n => {
      counts[n.base] = (counts[n.base] || 0) + 1;
      totalBrightness += n.brightness;
    });
    
    let tonic = collectedNotes[0].base;
    let maxCount = 0;
    for (const [note, count] of Object.entries(counts)) {
      if (count > maxCount) { maxCount = count; tonic = note; }
    }
    
    const avgBrightness = totalBrightness / collectedNotes.length;
    const scaleType = avgBrightness > 127 ? 'major' : 'minor';
    const scale = SCALES[scaleType];
    
    statusEl.textContent = `Тональность: ${tonic} (${scaleType === 'major' ? 'светлая' : 'мрачная'})`;

    let playHead = 0;
    // Очень быстрый темп воспроизведения
    let baseDelay = 100; 
    let chordInterval = Math.floor(Math.random() * 3) + 2; 

    function playNextNote() {
      if (playHead >= collectedNotes.length) {
        statusEl.textContent = "Готово!";
        scanBtn.disabled = false;
        noteEl.textContent = "—";
        return;
      }

      const current = collectedNotes[playHead];
      
      let duration = 0.2 + Math.random() * 0.2; 
      let vol = 0.1 + (current.brightness / 255) * 0.15;
      
      playTone(current.freq, duration, vol, 'triangle');
      
      if (playHead % chordInterval === 0) {
        let stepShift = scale[Math.floor(Math.random() * scale.length)];
        let harmonyFreq = current.freq * Math.pow(2, stepShift / 12);
        if (Math.random() > 0.5) harmonyFreq /= 2;
        
        playTone(harmonyFreq, duration * 1.5, 0.08, 'sine');
      }

      noteEl.textContent = current.base;
      playHead += 1; // Играем ВСЕ 100 нот подряд
      
      let nextDelay = baseDelay + (Math.random() * 50 - 25); 
      setTimeout(playNextNote, nextDelay);
    }

    playNextNote();
  }, 1000);
}

document.getElementById('start').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    unlockBtn.style.display = 'block';
    statusEl.textContent = "Включи звук и нажми 'Сканировать'";
  } catch (e) {
    alert('Камера недоступна: ' + e.message);
  }
};

scanBtn.onclick = startScan;

document.getElementById('stop').onclick = () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  noteEl.textContent = '—';
  statusEl.textContent = '';
  scannerLine.innerHTML = "";
  scanBtn.disabled = true;
  unlockBtn.style.display = 'none';
};
</script>
</body>
</html>
